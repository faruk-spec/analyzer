name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with APK'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v1.0.3)'
        required: false
        type: string
        default: 'v1.0.3'

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace || true

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Ensure Persistent Signing Keystore
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -alias aviatorlab \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "aviatorsignallab2026" \
              -keypass "aviatorsignallab2026" \
              -dname "CN=AviatorSignalLab, OU=Research, O=Lab, L=Lab, ST=Lab, C=US"
          else
            echo "Using committed permanent release.jks (SHA256: $(sha256sum app/keystore/release.jks))"
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_debug.log || {
            echo "==== GRADLE ASSEMBLE DEBUG FAILURE LOG ===="
            tail -n 80 build_debug.log
            ERR_MSG=$(grep -E "(e: |error:|FAILURE:|\* What went wrong:)" build_debug.log | head -n 10 | tr '\n' ' | ' | tr -d '\r')
            echo "::error title=GradleCompileError::${ERR_MSG:-Build Failed}"
            exit 1
          }

      - name: Upload Build Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build_debug.log

      - name: Build Release APK
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'aviatorsignallab2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'aviatorlab' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'aviatorsignallab2026' }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build_release.log || {
            echo "==== GRADLE ASSEMBLE RELEASE FAILURE LOG ===="
            tail -n 80 build_release.log
            echo "::warning::assembleRelease failed, falling back to debug signed APK"
          }

      - name: Upload Build Release Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build_release.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviator-signal-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aviator-signal-lab-release
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Prepare Release Assets
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true')
        id: release_prep
        run: |
          mkdir -p release_assets
          # Find release apk or fallback to debug apk or any generated apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/AviatorSignalLab.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/AviatorSignalLab.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/AviatorSignalLab.apk
          else
            echo "Searching for any generated APK..."
            find app/build/outputs/ -name "*.apk" -exec cp {} release_assets/AviatorSignalLab.apk \; -quit
          fi

          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*versionName = "\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.3"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="4"; fi

          TAG_NAME="v$VERSION_NAME"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Generate release metadata JSON for in-app update checker
          cat <<EOF > release_assets/latest_release.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "releaseNotes": "Aviator Signal Lab $TAG_NAME. Passive client-side network observability, pre-crash window feature extraction (T-0.1s to T-5.0s), empirical significance testing, and leakage-proof offline analysis.",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/AviatorSignalLab.apk",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Create or Update GitHub Release
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_prep.outputs.tag_name }}
          name: Release ${{ steps.release_prep.outputs.tag_name }}
          body: |
            ## Aviator Signal Lab - Scientific Network Observability & Pre-Crash Analyzer
            
            ### Highlights
            - Passive client-side network observability (WebSocket, Fetch, XHR, EventSource, postMessage)
            - Multi-window pre-crash activity analysis (T-0.1s to T-5.0s) vs matched control windows
            - Strict leakage prevention ($T \ge T_{crash}$ marked POST_CRASH and excluded)
            - Honest empirical reporting: identifies repeatable signals or reports "No Reliable Signal"
            - In-app version checking & update installation
            - Full CSV and ZIP dataset export
            
            *Automated build by GitHub Actions.*
          files: |
            release_assets/AviatorSignalLab.apk
            release_assets/latest_release.json
          draft: false
          prerelease: false
